services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - mdu_data:/var/www/html/data
      - mdu_uploads:/var/www/html/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost/api/data.php')?'0':'1');\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mdu_data:
  mdu_uploads:
